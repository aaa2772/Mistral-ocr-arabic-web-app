<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<title>تطبيق OCR</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4A90D9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OCR App">
<link rel="stylesheet" href="styles.css">
<script src="vendor/pdf.min.js"></script>
<script src="app.js?v=metadata-ui-20260606" defer></script>
</head>
<body>
<header class="header">
  <div>
    <h1>تطبيق OCR</h1>
    <p class="header-subtitle">تحويل ملفات PDF والصور إلى نص قابل للتحرير</p>
  </div>
  <button class="icon-btn" id="clearHistoryBtn" type="button" title="مسح السجل" aria-label="مسح السجل">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h16"></path>
      <path d="M10 11v6"></path>
      <path d="M14 11v6"></path>
      <path d="M6 7l1 14h10l1-14"></path>
      <path d="M9 7V4h6v3"></path>
    </svg>
  </button>
</header>

<main class="main">
  <section class="upload-section" aria-labelledby="uploadTitle">
    <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="رفع ملف PDF أو صورة">
      <div class="upload-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 16V4"></path>
          <path d="M7 9l5-5 5 5"></path>
          <path d="M20 16.5A4.5 4.5 0 0 1 15.5 21h-7A4.5 4.5 0 0 1 4 16.5"></path>
        </svg>
      </div>
      <h2 id="uploadTitle">ارفع ملفا أو اسحبه هنا</h2>
      <p>PDF أو PNG أو JPG أو WEBP أو BMP أو TIFF، بحد أقصى 50MB.</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tiff">
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </section>

  <button class="mobile-scan-btn" id="mobileScanBtn" type="button" aria-label="التقاط صورة بالكاميرا">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path>
      <circle cx="12" cy="13" r="4"></circle>
    </svg>
  </button>

  <section class="options-panel" aria-label="خيارات OCR">
    <label>
      <span class="field-label">الصفحات</span>
      <input id="pagesInput" type="text" inputmode="numeric" placeholder="الكل أو 1,3-5" autocomplete="off" aria-describedby="pagesHint">
      <span class="field-hint" id="pagesHint">اتركها فارغة لمعالجة كل الصفحات.</span>
    </label>
    <label>
      <span class="field-label">الجداول</span>
      <select id="tableFormatSelect" aria-describedby="tablesHint">
        <option value="">داخل النص</option>
        <option value="markdown">Markdown</option>
        <option value="html">HTML معقم</option>
      </select>
      <span class="field-hint" id="tablesHint">اختر تنسيقا منفصلا عند الحاجة لفحص الجداول.</span>
    </label>
    <label>
      <span class="field-label">الثقة</span>
      <select id="confidenceSelect" aria-describedby="confidenceHint">
        <option value="">بدون</option>
        <option value="page">على مستوى الصفحة</option>
        <option value="word">على مستوى الكلمة</option>
      </select>
      <span class="field-hint" id="confidenceHint">مستوى الكلمة أدق لكنه يزيد حجم الاستجابة.</span>
    </label>
  </section>

  <section class="processing-section" id="processingSection" aria-live="polite">
    <div class="processing-label" id="processingLabel">جاري المعالجة</div>
    <div class="progress-track" role="progressbar" aria-label="حالة المعالجة">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <button class="btn btn-ghost cancel-btn" id="cancelBtn" type="button">إلغاء</button>
  </section>

  <section class="results-section" id="resultsSection" aria-label="نتيجة OCR">
    <div class="results-grid">
      <section class="preview-panel" aria-label="معاينة الملف">
        <div class="preview-container" id="previewContainer"></div>
        <div class="preview-controls">
          <button class="icon-btn" id="zoomBtn" type="button" title="تكبير" aria-label="تكبير المعاينة">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M16.5 16.5 21 21"></path>
              <path d="M11 8v6"></path>
              <path d="M8 11h6"></path>
            </svg>
          </button>
          <button class="icon-btn" id="prevPageBtn" type="button" title="الصفحة السابقة" aria-label="الصفحة السابقة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <span class="page-num" id="pageNum">1 / 1</span>
          <button class="icon-btn" id="nextPageBtn" type="button" title="الصفحة التالية" aria-label="الصفحة التالية">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </div>
      </section>

      <section class="editor-panel" aria-label="النص المستخرج">
        <div class="toolbar" role="toolbar" aria-label="أدوات تحرير النص">
          <button class="icon-btn text-btn" data-command="bold" type="button" title="عريض" aria-label="عريض"><strong>B</strong></button>
          <button class="icon-btn text-btn" data-command="italic" type="button" title="مائل" aria-label="مائل"><em>I</em></button>
          <button class="icon-btn text-btn" data-command="underline" type="button" title="تحته خط" aria-label="تحته خط"><u>U</u></button>
          <div class="sep" aria-hidden="true"></div>
          <button class="icon-btn" id="linkBtn" type="button" title="إضافة رابط" aria-label="إضافة رابط">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path>
              <path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"></path>
            </svg>
          </button>
          <button class="icon-btn" data-command="unlink" type="button" title="إزالة الرابط" aria-label="إزالة الرابط">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1"></path>
              <path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1"></path>
              <path d="M4 4l16 16"></path>
            </svg>
          </button>
          <div class="sep" aria-hidden="true"></div>
          <button class="icon-btn" data-command="insertOrderedList" type="button" title="قائمة مرقمة" aria-label="قائمة مرقمة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10"></path><path d="M10 12h10"></path><path d="M10 18h10"></path><path d="M4 6h1v4"></path><path d="M4 12h2l-2 4h2"></path></svg>
          </button>
          <button class="icon-btn" data-command="insertUnorderedList" type="button" title="قائمة نقطية" aria-label="قائمة نقطية">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>
          </button>
          <div class="sep" aria-hidden="true"></div>
          <button class="icon-btn" id="downloadBtn" type="button" title="تنزيل النص" aria-label="تنزيل النص">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
          </button>
          <button class="icon-btn" id="printBtn" type="button" title="طباعة" aria-label="طباعة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5"></path><path d="M7 17H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"></path><path d="M7 14h10v7H7z"></path></svg>
          </button>
        </div>
        <div class="editor-content" id="editorContent" contenteditable="true" spellcheck="false" dir="auto" aria-label="النص المستخرج والقابل للتحرير"></div>
      </section>
    </div>
    <section class="result-details" id="resultDetails" aria-label="تفاصيل نتيجة OCR" hidden>
      <div class="result-summary" id="resultSummary"></div>
      <div class="detail-grid">
        <section class="detail-panel" id="confidenceDetails" aria-label="تفاصيل الثقة"></section>
        <section class="detail-panel" id="tableDetails" aria-label="الجداول المستخرجة"></section>
      </div>
    </section>
  </section>

  <section class="recent-scans" id="recentScansSection" aria-labelledby="recentTitle">
    <div class="section-title-row">
      <h2 id="recentTitle">آخر الملفات</h2>
      <span class="privacy-note">يتم حفظ الاسم وعدد الصفحات فقط.</span>
    </div>
    <div class="scan-list" id="scanList"></div>
  </section>
</main>

<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
